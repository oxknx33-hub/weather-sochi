services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: weather_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padminpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: admin
      PMA_PASSWORD: adminpass
    ports:
      - "8080:80"
    depends_on:
      - db

  metabase:
    image: metabase/metabase:v0.49.0
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: weather_db
      MB_DB_HOST: db
      MB_DB_PORT: 3306
      MB_DB_USER: admin
      MB_DB_PASS: adminpass
    depends_on:
      - db

  webapp:
    build: ./webapp
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: adminpass
      DB_NAME: weather_db
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - webapp
      - phpmyadmin
      - metabase

  parser:
    build: ./parser
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: adminpass
      DB_NAME: weather_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
